<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flor Mágica de Rapunzel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Great Vibes & Cinzel Decorative -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold-bright: #FFE066;
            --gold-glow: #FFB703;
            --magic-purple-dark: #0B0314;
            --magic-purple-light: #200D36;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, var(--magic-purple-light) 0%, var(--magic-purple-dark) 100%);
            min-height: 100vh;
            color: #FAF0CA;
            overflow-x: hidden;
        }

        .font-magic {
            font-family: 'Cinzel Decorative', serif;
        }

        .font-cursive {
            font-family: 'Great Vibes', cursive;
        }

        /* Canvas de fondo */
        #magic-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Contenedor principal con resplandor mágico de Rapunzel */
        .golden-card {
            background: rgba(18, 7, 33, 0.85);
            backdrop-filter: blur(14px);
            border: 1.5px solid rgba(255, 215, 0, 0.45);
            box-shadow: 0 0 40px rgba(255, 183, 3, 0.3), inset 0 0 20px rgba(255, 224, 102, 0.1);
            border-radius: 1.5rem;
        }

        /* Animación de pulso dorado mágico */
        @keyframes sunGlow {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(255, 224, 102, 0.6)) drop-shadow(0 0 20px rgba(255, 183, 3, 0.4));
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(255, 224, 102, 0.9)) drop-shadow(0 0 45px rgba(255, 183, 3, 0.7));
            }
        }

        .animate-sundrop-glow {
            animation: sunGlow 3.5s infinite ease-in-out;
        }

        /* Borde resplandeciente para el iframe */
        .video-wrapper {
            box-shadow: 0 0 25px rgba(255, 183, 3, 0.4);
            border: 1px solid rgba(255, 224, 102, 0.6);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4 py-8 relative">

    <canvas id="magic-canvas"></canvas>

    <main class="w-full max-w-2xl golden-card p-6 md:p-8 relative z-10 my-auto text-center">

        <!-- Encabezado con Flor Mágica -->
        <header class="mb-6">
            <div class="inline-block relative mb-2">
                <!-- SVG de la Flor Mágica de Rapunzel -->
                <svg class="w-16 h-16 md:w-20 md:h-20 mx-auto animate-sundrop-glow" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 95 C50 75 48 65 50 55" stroke="#FFE066" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M50 75 C40 70 30 75 25 80 C35 85 45 80 50 75Z" fill="#D4AF37" opacity="0.8"/>
                    <path d="M50 68 C60 63 70 68 75 73 C65 78 55 73 50 68Z" fill="#D4AF37" opacity="0.8"/>
                    <path d="M50 50 C40 30 30 20 50 5 C70 20 60 30 50 50Z" fill="#FFE066"/>
                    <path d="M50 50 C30 40 20 30 5 50 C20 70 30 60 50 50Z" fill="#FFC300"/>
                    <path d="M50 50 C60 30 70 20 95 50 C70 60 60 70 50 50Z" fill="#FFC300"/>
                    <path d="M50 50 C40 60 30 70 50 95 C70 70 60 60 50 50Z" fill="#FF9000"/>
                    <path d="M50 50 C35 35 15 25 25 10 C40 20 45 35 50 50Z" fill="#FFEA00"/>
                    <path d="M50 50 C65 35 85 25 75 10 C60 20 55 35 50 50Z" fill="#FFEA00"/>
                    <circle cx="50" cy="50" r="8" fill="#FFFFFF"/>
                    <circle cx="50" cy="50" r="5" fill="#FFE066"/>
                </svg>
            </div>
            
            <h1 class="font-magic text-2xl md:text-3xl text-amber-200 tracking-wider mb-1">
                Flor Mágica
            </h1>
            <p class="font-cursive text-2xl md:text-3xl text-amber-300/90">
                Flor que da fulgor, con tu brillo fiel...
            </p>
        </header>

        <!-- Seccion del Video de YouTube configurado por defecto con tu video -->
        <section class="mb-6">
            <div class="video-wrapper relative w-full aspect-video rounded-xl overflow-hidden bg-black/80">
                <iframe 
                    id="youtube-player"
                    class="w-full h-full border-0"
                    src="https://www.youtube.com/embed/2bzensPFqkc?autoplay=0&rel=0" 
                    title="Nuestra Escena Mágica"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; webshare" 
                    allowfullscreen>
                </iframe>
            </div>
        </section>

        <!-- Control para cambiar enlace si lo necesitas en el futuro -->
        <section class="space-y-3">
            <div class="flex flex-col sm:flex-row items-center gap-2">
                <div class="relative w-full flex-1">
                    <i class="fa-brands fa-youtube absolute left-3 top-1/2 -translate-y-1/2 text-rose-400 text-base"></i>
                    <input 
                        type="text" 
                        id="youtube-url-input" 
                        value="https://www.youtube.com/watch?v=2bzensPFqkc"
                        placeholder="Pega el enlace de YouTube aquí..." 
                        class="w-full pl-9 pr-3 py-2.5 rounded-xl bg-purple-950/60 border border-amber-400/40 text-amber-100 placeholder-amber-200/40 text-xs md:text-sm focus:outline-none focus:border-amber-300 focus:ring-1 focus:ring-amber-300 transition-all"
                    >
                </div>
                <button 
                    id="load-video-btn" 
                    class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-purple-950 font-semibold text-xs md:text-sm transition-all shadow-lg hover:shadow-amber-500/30 flex items-center justify-center gap-2 whitespace-nowrap"
                >
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Cargar Video</span>
                </button>
            </div>
            <p id="error-message" class="text-xs text-rose-400 hidden">Ingresa un enlace de YouTube válido.</p>
        </section>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            /* --- 1. FONDO MÁGICO DE FLORES DE RAPUNZEL Y POLVO DE ESTRELLAS --- */
            const canvas = document.getElementById('magic-canvas');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const SundropFlowers = [];
            const Stardust = [];
            const flowerCount = 14;
            const dustCount = 60;

            function drawSundropFlower(ctx, x, y, size, opacity, rotation) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation);
                ctx.globalAlpha = opacity;

                const petalColor = '#FFE066';
                const petalGlow = '#FFB703';
                const centerColor = '#FFFFFF';

                ctx.shadowColor = petalGlow;
                ctx.shadowBlur = size * 1.2;

                for (let i = 0; i < 8; i++) {
                    ctx.rotate((Math.PI * 2) / 8);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(-size * 0.3, -size * 0.5, -size * 0.2, -size, 0, -size * 1.2);
                    ctx.bezierCurveTo(size * 0.2, -size, size * 0.3, -size * 0.5, 0, 0);
                    ctx.fillStyle = i % 2 === 0 ? petalColor : petalGlow;
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(0, 0, size * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = centerColor;
                ctx.fill();

                ctx.restore();
            }

            class MagicFlower {
                constructor() {
                    this.reset();
                    this.y = Math.random() * canvas.height;
                }

                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height + 50;
                    this.size = Math.random() * 16 + 14;
                    this.speedY = Math.random() * 0.4 + 0.2;
                    this.speedX = Math.sin(Math.random() * Math.PI) * 0.3;
                    this.opacity = Math.random() * 0.5 + 0.35;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotationSpeed = (Math.random() - 0.5) * 0.008;
                }

                update() {
                    this.y -= this.speedY;
                    this.x += Math.sin(this.y * 0.005) * 0.4;
                    this.rotation += this.rotationSpeed;
                    if (this.y < -60) this.reset();
                }

                draw() {
                    drawSundropFlower(ctx, this.x, this.y, this.size, this.opacity, this.rotation);
                }
            }

            class StarParticle {
                constructor() {
                    this.reset();
                    this.y = Math.random() * canvas.height;
                }

                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2 + 0.5;
                    this.opacity = Math.random() * 0.8 + 0.2;
                    this.pulseSpeed = Math.random() * 0.03 + 0.01;
                }

                update() {
                    this.opacity += Math.sin(Date.now() * this.pulseSpeed * 0.1) * 0.02;
                    if (this.opacity <= 0.1) this.opacity = 0.1;
                    if (this.opacity >= 0.9) this.opacity = 0.9;
                }

                draw() {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 238, 150, ${this.opacity})`;
                    ctx.shadowColor = '#FFE066';
                    ctx.shadowBlur = 6;
                    ctx.fill();
                    ctx.restore();
                }
            }

            for (let i = 0; i < flowerCount; i++) SundropFlowers.push(new MagicFlower());
            for (let i = 0; i < dustCount; i++) Stardust.push(new StarParticle());

            function animateBackground() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                Stardust.forEach(star => {
                    star.update();
                    star.draw();
                });

                SundropFlowers.forEach(flower => {
                    flower.update();
                    flower.draw();
                });

                requestAnimationFrame(animateBackground);
            }
            animateBackground();

            /* --- 2. LÓGICA DE EXTRACCIÓN Y CARGA DE VIDEO DE YOUTUBE --- */
            const iframe = document.getElementById('youtube-player');
            const urlInput = document.getElementById('youtube-url-input');
            const loadBtn = document.getElementById('load-video-btn');
            const errorMsg = document.getElementById('error-message');

            function extractYouTubeId(url) {
                if (!url) return null;
                url = url.trim();

                if (url.length === 11 && !url.includes('/') && !url.includes('.')) {
                    return url;
                }

                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);

                return (match && match[2].length === 11) ? match[2] : null;
            }

            function loadVideo() {
                const inputVal = urlInput.value;
                const videoId = extractYouTubeId(inputVal);

                if (videoId) {
                    errorMsg.classList.add('hidden');
                    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
                } else if (inputVal.trim() !== '') {
                    errorMsg.classList.remove('hidden');
                }
            }

            loadBtn.addEventListener('click', loadVideo);
            urlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    loadVideo();
                }
            });

        });
    </script>
</body>
</html>
