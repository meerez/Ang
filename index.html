<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor Minimalista</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Contenedor centrado */
    .video-wrapper {
      position: relative;
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 85vh;
      object-fit: contain;
      cursor: pointer;
    }

    /* Controles personalizados sobrepuestos */
    .controls-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .video-wrapper:hover .controls-overlay {
      opacity: 1;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .progress-filled {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 3px;
    }

    .buttons-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .left-controls, .right-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    button {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 1;
    }

    /* Cargar archivo local */
    .file-input-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .file-label {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .file-label:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Selector para probar tu video -->
  <div class="file-input-container">
    <label for="video-file" class="file-label">📁 Seleccionar archivo de video</label>
    <input type="file" id="video-file" accept="video/mp4,video/webm,video/ogg">
  </div>

  <!-- Reproductor Centrado -->
  <div class="video-wrapper">
    <video id="my-video" src="" preload="metadata"></video>
    
    <div class="controls-overlay">
      <div class="progress-bar" id="progress-bar">
        <div class="progress-filled" id="progress-filled"></div>
      </div>
      
      <div class="buttons-row">
        <div class="left-controls">
          <button id="play-btn">▶</button>
          <button id="mute-btn">🔊</button>
        </div>
        <div class="right-controls">
          <button id="fullscreen-btn">⛶</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('my-video');
    const playBtn = document.getElementById('play-btn');
    const muteBtn = document.getElementById('mute-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressFilled = document.getElementById('progress-filled');
    const fileInput = document.getElementById('video-file');

    // Cargar archivo local desde la computadora
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        video.src = fileURL;
        video.play();
        playBtn.textContent = '❚❚';
      }
    });

    // Reproducir / Pausar
    function togglePlay() {
      if (video.paused) {
        video.play();
        playBtn.textContent = '❚❚';
      } else {
        video.pause();
        playBtn.textContent = '▶';
      }
    }

    playBtn.addEventListener('click', togglePlay);
    video.addEventListener('click', togglePlay);

    // Barra de progreso
    video.addEventListener('timeupdate', () => {
      const percentage = (video.currentTime / video.duration) * 100;
      progressFilled.style.width = `${percentage}%`;
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      video.currentTime = pos * video.duration;
    });

    // Mute
    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      muteBtn.textContent = video.muted ? '🔇' : '🔊';
    });

    // Pantalla Completa
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        video.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
